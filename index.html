<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مصروفاتي</title>
<meta name="theme-color" content="#0F1614">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مصروفاتي">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1614; --surface:#17211E; --ink:#E4EEEA; --muted:#8FA8A0; --line:#27352F;
  --accent:#4FC39A; --accent-ink:#0B1A15; --danger:#E27B6A; --bar:#24493C; color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1614; --surface:#17211E; --ink:#E4EEEA; --muted:#8FA8A0; --line:#27352F;
    --accent:#4FC39A; --accent-ink:#0B1A15; --danger:#E27B6A; --bar:#24493C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#17211E; --ink:#E4EEEA; --muted:#8FA8A0; --line:#27352F;
  --accent:#4FC39A; --accent-ink:#0B1A15; --danger:#E27B6A; --bar:#24493C; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.6}
main{max-width:520px;margin:0 auto;padding:20px 16px 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:1.1rem;margin:0;font-weight:500;color:var(--muted)}
input,select,button{font:inherit;color:inherit}
input[type=month]{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.total{margin:18px 0 6px}
.total .num{font-size:3.4rem;font-weight:700;line-height:1.1;letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
.total .cur{font-size:1.2rem;color:var(--muted);margin-inline-start:8px;font-weight:400}
.sub{color:var(--muted);margin:0 0 20px}
.cats{margin:0 0 24px;padding:0;list-style:none;display:grid;gap:8px}
.cats li{position:relative;border-radius:10px;overflow:hidden;background:var(--surface);border:1px solid var(--line);padding:8px 12px;display:flex;justify-content:space-between;font-size:.95rem}
.cats li i{position:absolute;inset:0 auto 0 0;background:var(--bar);z-index:0}
.cats li span{position:relative;z-index:1}
[dir=rtl] .cats li i{inset:0 0 0 auto}
form{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;margin-bottom:24px}
form .row{display:grid;grid-template-columns:1fr;gap:10px}
label{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
form input,form select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:1rem;color:var(--ink);width:100%}
form input:focus-visible,form select:focus-visible,button:focus-visible,input[type=month]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.amount{font-size:1.4rem!important;font-weight:700}
.add{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px;font-weight:700;font-size:1.05rem;cursor:pointer}
h2{font-size:.95rem;font-weight:500;color:var(--muted);margin:20px 0 6px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.item .main{flex:1;min-width:0}
.item .cat{font-weight:500}
.item .note{color:var(--muted);font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .amt{font-weight:700;font-variant-numeric:tabular-nums}
.del{background:none;border:0;color:var(--danger);cursor:pointer;padding:6px 8px;border-radius:8px;font-size:.9rem}
.empty{color:var(--muted);text-align:center;padding:24px 0}
.msg{color:var(--danger);font-size:.88rem;min-height:1.2em;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:24px}
.card h3{margin:0 0 8px;font-size:1rem;font-weight:700}
#list{max-height:460px;overflow-y:auto}
#list .item{background:var(--bg)}
#list h2:first-child{margin-top:4px}
.wk{display:grid;gap:6px}
.wk .big{font-size:1.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.wk .line{display:flex;justify-content:space-between;color:var(--muted);font-size:.92rem}
.wk .up{color:var(--danger)}
.wk .down{color:var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{background:none;border:0;border-radius:9px;padding:10px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--danger);color:#1A0B08}
.seg button.on[data-t=in]{background:var(--accent);color:var(--accent-ink)}
.item .amt.out{color:var(--danger)}
.item .amt.in{color:var(--accent)}
.flt{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:10px}
.flt button{background:none;border:0;border-radius:9px;padding:8px;font-weight:700;cursor:pointer;color:var(--muted)}
.flt button.on{background:var(--line);color:var(--ink)}
.del:not(.confirm){font-size:1.2rem;line-height:1}
.del.confirm{background:var(--danger);color:#1A0B08;font-weight:700}
form.mini{background:none;border:0;padding:0;margin:12px 0 4px;grid-template-columns:1fr 1fr;gap:8px}
form.mini .add{grid-column:1 / -1}
#owedList .item{background:var(--bg)}
.row2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fold{margin-top:6px}
.fold summary{cursor:pointer;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
.fold summary::-webkit-details-marker{display:none}
.fold summary::after{content:"▾";color:var(--muted)}
.fold[open] summary::after{content:"▴"}
.fold[open] summary{margin-bottom:8px}

#lock{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#lock[hidden]{display:none}
#lock h2{margin:0;font-size:1.3rem}
#lock p{margin:0;color:var(--muted)}
#lock input{width:200px;text-align:center;font-size:1.8rem;letter-spacing:.5em;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
#lock button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 36px;font-weight:700;cursor:pointer}
#lockMsg{color:var(--danger);min-height:1.2em}
body.locked main{display:none}
</style>
</head>
<body class="locked">
<div id="lock" hidden>
  <h2 id="lockTitle">مصروفاتي</h2>
  <p id="lockSub"></p>
  <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="الرقم السري">
  <input id="pin2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="تأكيد الرقم السري" hidden>
  <p id="lockMsg" role="alert"></p>
  <button id="lockBtn" type="button">دخول</button>
</div>
<main>
  <div class="top">
    <h1>مصروفاتي</h1>
    <input type="month" id="month" aria-label="الشهر">
  </div>

  <div class="row2" style="margin-top:18px">
    <p class="sub" style="margin:0">رصيد الشهر (الإضافات ناقص الخصومات)</p>
  </div>
  <div class="total" style="margin-top:2px"><span class="num" id="total" dir="ltr">0</span><span class="cur">جنيه</span></div>
  <p class="sub" id="count"></p>
  <ul class="cats" id="cats"></ul>

  <section class="card" id="weekCard"><details class="fold" id="weekFold"><summary>ملخص الأسبوع</summary><div id="week" aria-live="polite"></div></details></section>

  <form id="form" autocomplete="off">
    <div class="seg" role="radiogroup" aria-label="نوع العملية">
      <button type="button" class="on" data-t="out" role="radio" aria-checked="true">خصم</button>
      <button type="button" data-t="in" role="radio" aria-checked="false">إضافة</button>
    </div>
    <label>المبلغ
      <input class="amount" id="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0">
    </label>
    <div id="catwrap">
      <label>النوع
        <select id="cat">
          <option>مواصلات</option><option>أكل وشرب</option><option>باقة إنترنت</option><option>ترفيه</option><option>مستلزمات الشغل</option><option>جمعية ٧</option><option>جمعية ١</option><option>شيء آخر</option>
        </select>
      </label>
    </div>
    <div id="srcwrap" hidden>
      <label>المصدر
        <select id="src">
          <option>فودافون كاش</option><option>أورانج كاش</option><option>إنستا باي</option><option>في إيدي وربنا يسترها</option>
        </select>
      </label>
    </div>
    <label>ملاحظة (اختياري)
      <input type="text" id="note" maxlength="60" placeholder="مثلا: غدا مع الشغل">
    </label>
    <p class="msg" id="msg" role="alert"></p>
    <button class="add" type="submit">تسجيل</button>
  </form>

  <section class="card">
    <details class="fold" id="logFold"><summary>سجل العمليات</summary>
    <div class="flt" id="flt" role="radiogroup" aria-label="تصفية السجل">
      <button type="button" class="on" data-f="all">الكل</button>
      <button type="button" data-f="out">خصم</button>
      <button type="button" data-f="in">إضافة</button>
    </div>
    <div id="list"></div>
    </details>
  </section>

  <section class="card" id="owed">
    <div class="row2" style="margin-bottom:8px">
      <h3 style="margin:0">ليك بره</h3>
    </div>
    <div class="wk">
      <div class="big" id="owedTotal" dir="ltr">0</div>
      <div class="line">إجمالي اللي ليك عند الناس (جنيه)</div>
    </div>
    <form class="mini" id="owedForm" autocomplete="off">
      <input id="oName" type="text" maxlength="30" placeholder="اسم الشخص">
      <input id="oAmt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="المبلغ">
      <button class="add" type="submit">إضافة</button>
    </form>
    <p class="msg" id="oMsg" role="alert"></p>
    <details class="fold">
      <summary id="owedSum">التفاصيل</summary>
      <div id="owedList"></div>
    </details>
  </section>
  <section class="card">
    <details class="fold" id="bkFold"><summary>نسخة احتياطية</summary>
      <p class="sub" style="margin:0 0 10px">احفظ نسخة من مصروفاتك، أو استرجعها لو غيرت الموبايل.</p>
      <button class="add" type="button" id="bkExport" style="width:100%;margin-bottom:10px">حفظ نسخة (مشاركة أو نسخ)</button>
      <textarea id="bkText" rows="4" placeholder="للاسترجاع: الصق النسخة هنا" style="width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;color:var(--ink)"></textarea>
      <button class="add" type="button" id="bkImport" style="width:100%;margin-top:8px">استرجاع من النسخة</button>
      <p class="msg" id="bkMsg" role="status"></p>
    </details>
  </section>
</main>

<script>
(function(){
  var KEY = "expenses-v1";
  var items = [];
  try { items = JSON.parse(localStorage.getItem(KEY) || "[]"); if(!Array.isArray(items)) items = []; } catch(e){ items = []; }

  function save(){ try { localStorage.setItem(KEY, JSON.stringify(items)); } catch(e){} }
  function pad(n){ return String(n).padStart(2,"0"); }
  function today(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function fmt(n){ return Number(n).toLocaleString("en-US",{maximumFractionDigits:2}); }
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  var $ = function(id){ return document.getElementById(id); };
  $("month").value = today().slice(0,7);

  function render(){
    var m = $("month").value;
    var list = items.filter(function(x){ return x.date.slice(0,7) === m; })
                    .sort(function(a,b){ return b.date.localeCompare(a.date) || b.id - a.id; });
    var outs = list.filter(isOut);
    var added = sum(list.filter(function(x){ return !isOut(x); }));
    var total = sum(outs);
    var net = added - total;
    $("total").textContent = fmt(net);
    renderWeek();
    $("count").textContent = list.length ? ("أضفت " + fmt(added) + " جنيه، وخصمت " + fmt(total) + " جنيه (" + list.length + " عملية)") : "";

    var byCat = {};
    outs.forEach(function(x){ byCat[x.cat] = (byCat[x.cat]||0) + x.amount; });
    var rows = Object.keys(byCat).sort(function(a,b){ return byCat[b]-byCat[a]; });
    $("cats").innerHTML = rows.map(function(c){
      var p = total ? Math.round(byCat[c]/total*100) : 0;
      return '<li><i style="width:'+p+'%"></i><span>'+esc(c)+'</span><span>'+fmt(byCat[c])+' جنيه</span></li>';
    }).join("");

    var logItems = items.filter(function(x){ return flt === "all" || (flt === "in") === !isOut(x); })
                        .sort(function(a,b){ return b.date.localeCompare(a.date) || b.id - a.id; });
    if(!logItems.length){ $("list").innerHTML = '<p class="empty">مفيش عمليات هنا لسه.</p>'; return; }
    var html = "", last = "";
    logItems.forEach(function(x){
      if(x.date !== last){ html += "<h2>"+x.date+"</h2>"; last = x.date; }
      html += '<div class="item"><div class="main"><div class="cat">'+esc(x.cat)+'</div>'
            + (x.note ? '<div class="note">'+esc(x.note)+'</div>' : '')
            + '</div><div class="amt '+(isOut(x)?'out':'in')+'" dir="ltr">'+(isOut(x)?'−':'+')+fmt(x.amount)+'</div>'
            + (pending === x.id ? '<button class="del confirm" data-id="'+x.id+'" dir="ltr">Delete</button>' : '<button class="del" data-id="'+x.id+'" aria-label="حذف">✕</button>') + '</div>';
    });
    $("list").innerHTML = html;
  }

  function ds(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function isOut(x){ return x.type !== "in"; }
  function sum(a){ return a.reduce(function(s,x){ return s + x.amount; }, 0); }
  function renderWeek(){
    var now = new Date(); now.setHours(12,0,0,0);
    var s = new Date(now); s.setDate(s.getDate() - ((now.getDay()+1) % 7));
    var ps = new Date(s); ps.setDate(ps.getDate() - 7);
    var e = new Date(s); e.setDate(e.getDate() + 6);
    var S = ds(s), P = ds(ps), E = ds(e);
    var all = items.filter(function(x){ return x.date >= S && x.date <= E; });
    var cur = all.filter(isOut);
    var addedW = sum(all.filter(function(x){ return !isOut(x); }));
    var prev = items.filter(function(x){ return x.date >= P && x.date < S && isOut(x); });
    var t = sum(cur), pt = sum(prev);
    var html = '<div class="wk">';
    if(!all.length){
      html += '<div class="line">مفيش مصروفات الأسبوع ده لحد دلوقتي (الأسبوع بيبدأ من السبت).</div></div>';
      $("week").innerHTML = html; return;
    }
    html += '<div class="line">إجمالي الخصومات</div>';
    html += '<div class="big">'+fmt(t)+' <span style="font-size:1rem;font-weight:400;color:var(--muted)">جنيه</span></div>';
    if(!pt){ html += '<div class="line">مفيش مصروفات الأسبوع اللي فات للمقارنة</div>'; }
    else {
      var d = t - pt;
      if(d > 0) html += '<div class="line up">زيادة '+fmt(d)+' جنيه عن الأسبوع اللي فات</div>';
      else if(d < 0) html += '<div class="line down">أقل بـ '+fmt(-d)+' جنيه من الأسبوع اللي فات</div>';
      else html += '<div class="line">زي الأسبوع اللي فات بالظبط</div>';
    }
    html += '<div class="line"><span>الإضافات</span><span>'+fmt(addedW)+' جنيه</span></div>';
    html += '<div class="line"><span>عدد عمليات الخصم</span><span>'+cur.length+'</span></div>';
    var by = {};
    cur.forEach(function(x){ by[x.cat] = (by[x.cat]||0) + x.amount; });
    Object.keys(by).sort(function(a,b){ return by[b]-by[a]; }).forEach(function(c){
      html += '<div class="line"><span>'+esc(c)+'</span><span>'+fmt(by[c])+' جنيه</span></div>';
    });
    html += '</div>';
    $("week").innerHTML = html;
  }

  $("form").addEventListener("submit", function(e){
    e.preventDefault();
    var amount = parseFloat($("amount").value);
    if(!(amount > 0)){ $("msg").textContent = "اكتب مبلغ أكبر من صفر."; $("amount").focus(); return; }
    $("msg").textContent = "";
    var date = today();
    items.push({ id: Date.now(), amount: amount, cat: type === "in" ? $("src").value : $("cat").value, type: type, note: $("note").value.trim(), date: date });
    save();
    $("month").value = date.slice(0,7);
    $("amount").value = ""; $("note").value = "";
    render();
    $("amount").focus();
  });

  $("list").addEventListener("click", function(e){
    var b = e.target.closest(".del"); if(!b) return;
    var id = Number(b.getAttribute("data-id"));
    if(pending === id){ items = items.filter(function(x){ return x.id !== id; }); pending = null; save(); }
    else { pending = id; }
    render();
  });

  document.addEventListener("click", function(e){
    if(pending !== null && !e.target.closest(".del")){ pending = null; render(); }
  });

  $("flt").addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    flt = b.getAttribute("data-f"); pending = null;
    var bs = $("flt").querySelectorAll("button");
    for(var i=0;i<bs.length;i++) bs[i].classList.toggle("on", bs[i] === b);
    render();
  });

  var type = "out";
  var pending = null, flt = "all";
  document.querySelector(".seg").addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    type = b.getAttribute("data-t");
    var bs = document.querySelectorAll(".seg button");
    for(var i=0;i<bs.length;i++){ var on = bs[i] === b; bs[i].classList.toggle("on", on); bs[i].setAttribute("aria-checked", on ? "true" : "false"); }
    $("catwrap").hidden = (type === "in");
    $("srcwrap").hidden = (type !== "in");
  });

  $("month").addEventListener("change", render);

  try { localStorage.removeItem("expenses-pw-v1"); } catch(e){}

  var OKEY = "owed-v1", owed = [], oPending = null;
  try { owed = JSON.parse(localStorage.getItem(OKEY) || "[]"); if(!Array.isArray(owed)) owed = []; } catch(e){ owed = []; }
  function saveOwed(){ try { localStorage.setItem(OKEY, JSON.stringify(owed)); } catch(e){} }
  function renderOwed(){
    $("owedTotal").textContent = fmt(sum(owed));
    $("owedSum").textContent = "تفاصيل اللي ليك بره (" + owed.length + ")";
    if(!owed.length){ $("owedList").innerHTML = '<p class="empty">مفيش حد واخد منك حاجة. أضف أول اسم فوق.</p>'; return; }
    $("owedList").innerHTML = owed.slice().sort(function(a,b){ return b.id - a.id; }).map(function(x){
      return '<div class="item"><div class="main"><div class="cat">'+esc(x.name)+'</div></div>'
        + '<div class="amt in" dir="ltr">'+fmt(x.amount)+'</div>'
        + (oPending === x.id ? '<button class="del confirm" data-id="'+x.id+'" dir="ltr">Delete</button>' : '<button class="del" data-id="'+x.id+'" aria-label="حذف">✕</button>')
        + '</div>';
    }).join("");
  }
  $("owedForm").addEventListener("submit", function(e){
    e.preventDefault();
    var name = $("oName").value.trim(), amt = parseFloat($("oAmt").value);
    if(!name){ $("oMsg").textContent = "اكتب اسم الشخص."; $("oName").focus(); return; }
    if(!(amt > 0)){ $("oMsg").textContent = "اكتب مبلغ أكبر من صفر."; $("oAmt").focus(); return; }
    $("oMsg").textContent = "";
    owed.push({ id: Date.now(), name: name, amount: amt });
    saveOwed(); $("oName").value = ""; $("oAmt").value = "";
    renderOwed(); $("oName").focus();
  });
  $("owedList").addEventListener("click", function(e){
    var b = e.target.closest(".del"); if(!b) return;
    var id = Number(b.getAttribute("data-id"));
    if(oPending === id){ owed = owed.filter(function(x){ return x.id !== id; }); oPending = null; saveOwed(); }
    else { oPending = id; }
    renderOwed();
  });
  document.addEventListener("click", function(e){
    if(oPending !== null && !e.target.closest(".del")){ oPending = null; renderOwed(); }
  });
  renderOwed();
  render();


  // ===== نسخة احتياطية =====
  function bkMsg(t){ $("bkMsg").textContent = t; }
  $("bkExport").addEventListener("click", function(){
    var txt = JSON.stringify({ v: 1, items: items, owed: owed });
    if(navigator.share){
      navigator.share({ title: "نسخة مصروفاتي", text: txt }).then(function(){ bkMsg("تمام."); }).catch(function(){});
      return;
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ bkMsg("اتنسخت. الصقها في أي مكان واحفظها."); }, function(){ $("bkText").value = txt; bkMsg("انسخ النص اللي في الخانة واحفظه."); });
    } else { $("bkText").value = txt; bkMsg("انسخ النص اللي في الخانة واحفظه."); }
  });
  $("bkImport").addEventListener("click", function(){
    var d;
    try { d = JSON.parse($("bkText").value.trim()); } catch(e){ bkMsg("النسخة مش مظبوطة."); return; }
    if(!d || !Array.isArray(d.items)){ bkMsg("النسخة مش مظبوطة."); return; }
    if(!confirm("ده هيستبدل المصروفات الحالية بالنسخة. تكمل؟")) return;
    items = d.items; owed = Array.isArray(d.owed) ? d.owed : [];
    save(); saveOwed(); render(); renderOwed();
    $("bkText").value = ""; bkMsg("اتسترجعت.");
  });
  // ===== نهاية النسخة الاحتياطية =====

  // ===== الرقم السري =====
  var PKEY = "pin-hash-v1";
  var lockEl = $("lock");
  function hashPin(p){
    var data = new TextEncoder().encode("masrofaty:" + p);
    if(window.crypto && crypto.subtle){
      return crypto.subtle.digest("SHA-256", data).then(function(b){
        return Array.prototype.map.call(new Uint8Array(b), function(x){ return ("0"+x.toString(16)).slice(-2); }).join("");
      });
    }
    var h = 5381; for(var i=0;i<p.length;i++) h = ((h<<5)+h) + p.charCodeAt(i);
    return Promise.resolve("s"+h);
  }
  function showLock(){
    document.body.classList.add("locked");
    lockEl.hidden = false;
    $("pin").value = ""; $("pin2").value = ""; $("lockMsg").textContent = "";
    var has = false; try { has = !!localStorage.getItem(PKEY); } catch(e){}
    $("pin2").hidden = has;
    $("lockSub").textContent = has ? "اكتب الرقم السري" : "اختار رقم سري من ٤ أرقام، واكتبه مرتين";
    $("lockBtn").textContent = has ? "دخول" : "حفظ ودخول";
    setTimeout(function(){ $("pin").focus(); }, 50);
  }
  function unlock(){ lockEl.hidden = true; document.body.classList.remove("locked"); }
  function tryLock(){
    var a = $("pin").value, has = false;
    try { has = !!localStorage.getItem(PKEY); } catch(e){}
    if(!/^[0-9]{4}$/.test(a)){ $("lockMsg").textContent = "اكتب ٤ أرقام."; return; }
    if(has){
      hashPin(a).then(function(h){
        if(h === localStorage.getItem(PKEY)) unlock();
        else { $("lockMsg").textContent = "الرقم غلط."; $("pin").value = ""; }
      });
    } else {
      if(a !== $("pin2").value){ $("lockMsg").textContent = "الرقمين مش زي بعض."; return; }
      hashPin(a).then(function(h){ try { localStorage.setItem(PKEY, h); } catch(e){} unlock(); });
    }
  }
  $("lockBtn").addEventListener("click", tryLock);
  ["pin","pin2"].forEach(function(id){
    $(id).addEventListener("keydown", function(e){ if(e.key === "Enter") tryLock(); });
  });
  $("pin").addEventListener("input", function(){
    var has = false; try { has = !!localStorage.getItem(PKEY); } catch(e){}
    if(has && /^[0-9]{4}$/.test($("pin").value)) tryLock();
  });
  document.addEventListener("visibilitychange", function(){ if(document.hidden) showLock(); });
  showLock();
  // ===== نهاية الرقم السري =====
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
